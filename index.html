<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌻 Para ti, Ashley — Flores Amarillas</title>
  <meta name="description" content="Un regalo digital de flores amarillas para alguien muy especial." />

  <!-- ============================================================
       GOOGLE FONTS — Tipografías elegantes
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <style>
    /* ==============================================================
       VARIABLES DE DISEÑO — Editá estos valores para personalizar
       ============================================================== */
    :root {
      /* Paleta principal */
      --color-bg-start: #fdf6e3;
      /* Fondo crema cálido (arriba) */
      --color-bg-end: #fef9ef;
      /* Fondo crema suave (abajo) */
      --color-yellow-vibrant: #f5c542;
      /* Amarillo cálido principal */
      --color-yellow-soft: #ffe78a;
      /* Amarillo suave */
      --color-yellow-glow: #ffd94a;
      /* Amarillo para brillos */
      --color-pink-soft: #f8d0d0;
      /* Rosa pastel suave */
      --color-pink-accent: #e8a0a0;
      /* Rosa acento */
      --color-text-dark: #3e2f1c;
      /* Texto principal (marrón cálido) */
      --color-text-medium: #7a6552;
      /* Texto secundario */
      --color-text-light: #a89279;
      /* Texto terciario */
      --color-white: #ffffff;

      /* Tipografías */
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      /* Tamaños */
      --flower-size: min(320px, 70vw);
    }

    /* ==============================================================
       RESET Y BASE
       ============================================================== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;

      /* Fondo degradado suave */
      background: linear-gradient(170deg,
          var(--color-bg-start) 0%,
          var(--color-bg-end) 50%,
          #fff7e6 100%);
    }

    /* ==============================================================
       PARTÍCULAS FLOTANTES — Corazones y puntos amarillos
       ============================================================== */
    .particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    /* Corazones flotantes */
    .particle--heart::before {
      content: '💛';
      font-size: var(--p-size, 16px);
      filter: saturate(0.7) brightness(1.1);
    }

    /* Puntos/pétalos flotantes */
    .particle--dot {
      width: var(--p-size, 8px);
      height: var(--p-size, 8px);
      background: var(--color-yellow-soft);
      border-radius: 50%;
      filter: blur(0.5px);
    }

    .particle--petal {
      width: var(--p-size, 10px);
      height: calc(var(--p-size, 10px) * 0.6);
      background: var(--color-yellow-vibrant);
      border-radius: 50% 50% 50% 0;
      opacity: 0.5;
      transform: rotate(var(--p-rotate, 0deg));
    }

    /* Lluvia de flores al hacer clic */
    .flower-rain {
      position: fixed;
      top: -60px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      filter: drop-shadow(0 2px 6px rgba(200, 160, 50, 0.25));
      animation: flowerFall var(--fr-duration, 4s) ease-in forwards;
      animation-delay: var(--fr-delay, 0s);
    }

    @keyframes flowerFall {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.5);
        opacity: 0;
      }

      8% {
        opacity: 1;
        transform: translateY(5vh) rotate(20deg) scale(1);
      }

      85% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(calc(100vh + 80px)) rotate(var(--fr-spin, 360deg)) scale(0.6);
        opacity: 0;
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: var(--p-opacity, 0.6);
      }

      90% {
        opacity: var(--p-opacity, 0.6);
      }

      100% {
        transform:
          translateY(calc(-100vh - 60px)) translateX(var(--p-drift, 30px)) rotate(var(--p-spin, 180deg));
        opacity: 0;
      }
    }

    /* ==============================================================
       CONTENEDOR PRINCIPAL
       ============================================================== */
    .main-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 2rem 1.5rem 4rem;
      min-height: 100vh;
    }

    /* ==============================================================
       ENCABEZADO SUTIL
       ============================================================== */
    .header-subtle {
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      text-align: center;
      opacity: 0;
      animation: fadeSlideDown 1s ease-out 0.3s forwards;
    }

    .header-subtle__date {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text-light);
    }

    .header-subtle__title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-pink-accent);
      margin-top: 0.3rem;
    }

    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==============================================================
       LA FLOR — Contenedor y animaciones
       ============================================================== */
    .flower-wrapper {
      position: relative;
      width: var(--flower-size);
      height: var(--flower-size);
      margin: 1rem 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Resplandor detrás de la flor */
    .flower-glow {
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: radial-gradient(circle,
          rgba(255, 215, 60, 0.25) 0%,
          rgba(255, 215, 60, 0.08) 50%,
          transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* SVG de la flor */
    .flower-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 20px rgba(245, 197, 66, 0.2));

      /* Animación de florecimiento al cargar */
      transform: scale(0) rotate(-30deg);
      animation: bloom 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
    }

    @keyframes bloom {
      0% {
        transform: scale(0) rotate(-30deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.08) rotate(3deg);
        opacity: 1;
      }

      80% {
        transform: scale(0.97) rotate(-1deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Balanceo suave continuo (se aplica después del bloom) */
    .flower-svg.bloomed {
      animation: gentleSway 4s ease-in-out infinite;
    }

    @keyframes gentleSway {

      0%,
      100% {
        transform: rotate(-1.5deg) scale(1);
      }

      25% {
        transform: rotate(1deg) scale(1.01);
      }

      50% {
        transform: rotate(1.5deg) scale(1);
      }

      75% {
        transform: rotate(-1deg) scale(1.01);
      }
    }

    /* Efecto brillo al revelar mensaje */
    .flower-svg.sparkle {
      animation: sparkleEffect 0.8s ease-out;
    }

    @keyframes sparkleEffect {
      0% {
        filter: drop-shadow(0 4px 20px rgba(245, 197, 66, 0.2));
        transform: scale(1);
      }

      30% {
        filter: drop-shadow(0 0 40px rgba(255, 215, 60, 0.7)) brightness(1.15);
        transform: scale(1.08);
      }

      60% {
        filter: drop-shadow(0 0 25px rgba(255, 215, 60, 0.4)) brightness(1.05);
        transform: scale(1.02);
      }

      100% {
        filter: drop-shadow(0 4px 20px rgba(245, 197, 66, 0.2));
        transform: scale(1);
      }
    }

    /* ==============================================================
       BOTÓN INTERACTIVO
       ============================================================== */
    .reveal-btn {
      position: relative;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-text-dark);
      background: linear-gradient(135deg, var(--color-yellow-soft) 0%, var(--color-yellow-vibrant) 100%);
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.03em;
      box-shadow:
        0 4px 15px rgba(245, 197, 66, 0.3),
        0 1px 3px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
      overflow: hidden;
      z-index: 1;

      /* Entrada con delay */
      opacity: 0;
      transform: translateY(10px);
      animation: fadeSlideUp 0.8s ease-out 2s forwards;
    }

    .reveal-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .reveal-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 8px 25px rgba(245, 197, 66, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .reveal-btn:hover::before {
      opacity: 1;
    }

    .reveal-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* Ocultar botón tras hacer clic */
    .reveal-btn.hidden {
      opacity: 0;
      transform: translateY(-10px) scale(0.9);
      pointer-events: none;
      transition: all 0.5s ease;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==============================================================
       PANEL DE MENSAJE
       ============================================================== */
    .message-panel {
      width: 100%;
      max-width: 480px;
      margin-top: 1.5rem;
      padding: 2rem 1.8rem;
      background: linear-gradient(160deg,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(253, 246, 227, 0.7) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 197, 66, 0.2);
      border-radius: 24px;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(245, 197, 66, 0.1),
        0 1px 4px rgba(0, 0, 0, 0.04);

      /* Estado oculto por defecto */
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      max-height: 0;
      overflow: hidden;
      pointer-events: none;
      transition:
        opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        max-height 1s ease;
    }

    .message-panel.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      max-height: 600px;
      pointer-events: auto;
    }

    /* ——— Textos del mensaje ——— */

    /* Línea principal */
    .message-panel__main {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--color-text-dark);
      margin-bottom: 1rem;
    }

    .message-panel__main .highlight {
      color: var(--color-yellow-vibrant);
      text-shadow: 0 0 8px rgba(245, 197, 66, 0.3);
    }

    .message-panel__name {
      display: inline-block;
      font-size: 1.5rem;
      color: var(--color-pink-accent);
      text-shadow: 0 0 10px rgba(232, 160, 160, 0.3);
    }

    /* Línea secundaria */
    .message-panel__secondary {
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--color-text-medium);
      margin-bottom: 1.2rem;
    }

    /* Línea de amor */
    .message-panel__love {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-text-dark);
      margin-bottom: 1rem;
    }

    .message-panel__love .heart {
      display: inline-block;
      font-style: normal;
      animation: heartbeat 1.2s ease-in-out infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.2);
      }

      30% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.15);
      }

      60% {
        transform: scale(1);
      }
    }

    /* Separador decorativo */
    .message-panel__divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-yellow-vibrant), transparent);
      margin: 1rem auto;
      border-radius: 2px;
    }

    /* Fecha */
    .message-panel__date {
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-light);
    }

    /* ==============================================================
       FOOTER SUTIL
       ============================================================== */
    .footer-heart {
      margin-top: auto;
      padding: 2rem 0 1rem;
      font-size: 0.75rem;
      color: var(--color-text-light);
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .footer-heart.visible {
      opacity: 1;
    }

    /* ==============================================================
       ANIMACIONES DE ENTRADA PARA LÍNEAS DEL MENSAJE
       ============================================================== */
    .message-panel.visible .msg-line {
      opacity: 0;
      transform: translateY(12px);
      animation: revealLine 0.6s ease-out forwards;
    }

    .message-panel.visible .msg-line:nth-child(1) {
      animation-delay: 0.2s;
    }

    .message-panel.visible .msg-line:nth-child(2) {
      animation-delay: 0.5s;
    }

    .message-panel.visible .msg-line:nth-child(3) {
      animation-delay: 0.8s;
    }

    .message-panel.visible .msg-line:nth-child(4) {
      animation-delay: 1.1s;
    }

    .message-panel.visible .msg-line:nth-child(5) {
      animation-delay: 1.4s;
    }

    @keyframes revealLine {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==============================================================
       RESPONSIVE — Ajustes para pantallas grandes
       ============================================================== */
    @media (min-width: 480px) {
      .main-wrapper {
        padding-top: 3rem;
      }

      .header-subtle__title {
        font-size: 1.25rem;
      }

      .message-panel__main {
        font-size: 1.5rem;
      }

      .message-panel__name {
        font-size: 1.7rem;
      }

      .reveal-btn {
        font-size: 1.05rem;
        padding: 1rem 2.5rem;
      }
    }

    @media (min-width: 768px) {
      :root {
        --flower-size: 360px;
      }

      .main-wrapper {
        padding-top: 4rem;
        justify-content: center;
      }

      .message-panel {
        padding: 2.5rem 2.2rem;
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       PARTÍCULAS FLOTANTES — Se generan via JavaScript
       ============================================================ -->
  <div class="particles-container" id="particles" aria-hidden="true"></div>

  <!-- ============================================================
       CONTENIDO PRINCIPAL
       ============================================================ -->
  <main class="main-wrapper">

    <!-- Encabezado sutil -->
    <header class="header-subtle">
      <!-- ✏️ EDITABLE: Cambiá la fecha aquí -->
      <p class="header-subtle__date">21 de Septiembre, 2026</p>
      <p class="header-subtle__title">Día de las flores amarillas</p>
    </header>

    <!-- La Flor -->
    <div class="flower-wrapper">
      <div class="flower-glow"></div>

      <!-- SVG Flor Amarilla — Diseño original inline -->
      <svg class="flower-svg" id="flower" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="Flor amarilla digital">
        <defs>
          <!-- Gradientes para los pétalos -->
          <radialGradient id="petalGrad" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffe566" />
            <stop offset="60%" stop-color="#f5c542" />
            <stop offset="100%" stop-color="#e6a817" />
          </radialGradient>

          <!-- Gradiente centro de la flor -->
          <radialGradient id="centerGrad" cx="45%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#8B6914" />
            <stop offset="50%" stop-color="#6B4F10" />
            <stop offset="100%" stop-color="#4a360b" />
          </radialGradient>

          <!-- Gradiente tallo -->
          <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5a8c3c" />
            <stop offset="100%" stop-color="#3d6b28" />
          </linearGradient>

          <!-- Gradiente hoja -->
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6aad45" />
            <stop offset="100%" stop-color="#4a8c2a" />
          </linearGradient>

          <!-- Filtro de sombra suave -->
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
            <feOffset dy="2" />
            <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" />
            <feMerge>
              <feMergeNode />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Tallo -->
        <path d="M 200 270 Q 195 340 198 390 Q 200 430 200 480" stroke="url(#stemGrad)" stroke-width="8" fill="none"
          stroke-linecap="round" />

        <!-- Hoja izquierda -->
        <path d="M 198 360 Q 150 340 130 360 Q 140 350 160 370 Q 180 375 198 365" fill="url(#leafGrad)" opacity="0.9" />

        <!-- Hoja derecha -->
        <path d="M 202 390 Q 250 375 268 390 Q 255 380 240 395 Q 220 400 202 395" fill="url(#leafGrad)"
          opacity="0.85" />

        <!-- Grupo de pétalos (capa trasera) -->
        <g filter="url(#softShadow)" opacity="0.85">
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(22.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(67.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(112.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(157.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(202.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(247.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(292.5, 200, 210)" />
          <ellipse cx="200" cy="148" rx="22" ry="50" fill="url(#petalGrad)" transform="rotate(337.5, 200, 210)" />
        </g>

        <!-- Grupo de pétalos (capa frontal) -->
        <g filter="url(#softShadow)">
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(0, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(45, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(90, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(135, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(180, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(225, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(270, 200, 210)" />
          <ellipse cx="200" cy="145" rx="25" ry="55" fill="url(#petalGrad)" transform="rotate(315, 200, 210)" />
        </g>

        <!-- Centro de la flor -->
        <circle cx="200" cy="210" r="38" fill="url(#centerGrad)" />

        <!-- Textura del centro (semillas) -->
        <g fill="#8B6914" opacity="0.6">
          <circle cx="190" cy="200" r="2.5" />
          <circle cx="200" cy="195" r="2.5" />
          <circle cx="210" cy="200" r="2.5" />
          <circle cx="195" cy="210" r="2.5" />
          <circle cx="205" cy="210" r="2.5" />
          <circle cx="200" cy="220" r="2.5" />
          <circle cx="185" cy="210" r="2" />
          <circle cx="215" cy="210" r="2" />
          <circle cx="200" cy="205" r="2" />
          <circle cx="190" cy="218" r="2" />
          <circle cx="210" cy="218" r="2" />
          <circle cx="210" cy="196" r="2" />
          <circle cx="190" cy="196" r="2" />
          <circle cx="182" cy="204" r="1.5" />
          <circle cx="218" cy="204" r="1.5" />
          <circle cx="196" cy="225" r="1.5" />
          <circle cx="204" cy="225" r="1.5" />
        </g>

        <!-- Brillo sutil en el centro -->
        <circle cx="192" cy="200" r="12" fill="white" opacity="0.08" />
      </svg>
    </div>

    <!-- Botón interactivo -->
    <!-- ✏️ EDITABLE: Cambiá el texto del botón aquí -->
    <button class="reveal-btn" id="revealBtn" type="button">
      Tocá aquí, mi amor
    </button>

    <!-- Panel del mensaje (oculto por defecto) -->
    <section class="message-panel" id="messagePanel" aria-live="polite">

      <!-- ============================================================
           ✏️ TEXTOS EDITABLES — Modificá el contenido del mensaje aquí
           ============================================================ -->

      <!-- Línea principal -->
      <p class="message-panel__main msg-line">
        Aquí tienes tus <span class="highlight">flores amarillas</span> digitales,
        <br />
        Amor de mi vida <span class="message-panel__name">ASHLEY</span>.
      </p>

      <!-- Separador -->
      <div class="message-panel__divider msg-line"></div>

      <!-- Línea secundaria -->
      <p class="message-panel__secondary msg-line">
        Aunque estamos lejos, este detalle es para recordarte
        lo especial que eres para mí.
      </p>

      <!-- Línea de amor -->
      <p class="message-panel__love msg-line">
        Te quiero mucho. <span class="heart">💛</span>
      </p>

      <!-- Fecha -->
      <p class="message-panel__date msg-line">
        21 de Septiembre, 2026
      </p>
    </section>

    <!-- Footer -->
    <footer class="footer-heart" id="footer">
      Hecho con 💛 para vos
    </footer>

  </main>

  <!-- ============================================================
       JAVASCRIPT — Interactividad y partículas
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      /* ==========================================================
         PARTÍCULAS FLOTANTES
         Genera corazones, puntos y pétalos amarillos animados
         ========================================================== */
      const particlesContainer = document.getElementById('particles');
      const PARTICLE_COUNT = 35;

      /**
       * Crea una partícula flotante con propiedades aleatorias
       * @param {number} index - Índice para distribuir las partículas
       */
      function createParticle(index) {
        const particle = document.createElement('div');

        // Tipo aleatorio: 65% corazones, 20% dots, 15% pétalos
        const rand = Math.random();
        let type;
        if (rand < 0.65) type = 'heart';
        else if (rand < 0.85) type = 'dot';
        else type = 'petal';

        particle.classList.add('particle', 'particle--' + type);

        // Propiedades CSS personalizadas para variación
        const size = type === 'heart'
          ? (14 + Math.random() * 16) + 'px'
          : (6 + Math.random() * 10) + 'px';

        const duration = 7 + Math.random() * 10;
        const delay = (index * 0.5) + Math.random() * 2;
        const left = Math.random() * 100;
        const drift = -50 + Math.random() * 100;
        const spin = Math.random() * 360;
        const opacity = 0.3 + Math.random() * 0.45;
        const rotate = Math.random() * 360;

        particle.style.cssText =
          'left:' + left + '%;' +
          '--p-size:' + size + ';' +
          '--p-drift:' + drift + 'px;' +
          '--p-spin:' + spin + 'deg;' +
          '--p-opacity:' + opacity + ';' +
          '--p-rotate:' + rotate + 'deg;' +
          'animation-duration:' + duration + 's;' +
          'animation-delay:' + delay + 's;';

        particlesContainer.appendChild(particle);
      }

      for (var i = 0; i < PARTICLE_COUNT; i++) {
        createParticle(i);
      }

      /* ==========================================================
         ANIMACIÓN DE FLORECIMIENTO → BALANCEO
         ========================================================== */
      const flower = document.getElementById('flower');

      flower.addEventListener('animationend', function handler(e) {
        if (e.animationName === 'bloom') {
          flower.classList.add('bloomed');
          flower.removeEventListener('animationend', handler);
        }
      });

      /* ==========================================================
         BOTÓN → REVELAR MENSAJE
         ========================================================== */
      const revealBtn = document.getElementById('revealBtn');
      const messagePanel = document.getElementById('messagePanel');
      const footer = document.getElementById('footer');

      revealBtn.addEventListener('click', function () {
        // 1. Efecto brillo en la flor
        flower.classList.remove('bloomed');
        flower.classList.add('sparkle');

        flower.addEventListener('animationend', function sparkleEnd(e) {
          if (e.animationName === 'sparkleEffect') {
            flower.classList.remove('sparkle');
            flower.classList.add('bloomed');
            flower.removeEventListener('animationend', sparkleEnd);
          }
        });

        // 2. Lluvia de flores amarillas 🌻
        launchFlowerRain();

        // 3. Ocultar botón
        revealBtn.classList.add('hidden');

        // 3. Mostrar panel de mensaje
        setTimeout(function () {
          messagePanel.classList.add('visible');
        }, 300);

        // 4. Mostrar footer
        setTimeout(function () {
          footer.classList.add('visible');
        }, 2000);
      });

      /* ==========================================================
         LLUVIA DE FLORES — Se dispara al hacer clic en el botón
         ========================================================== */
      function launchFlowerRain() {
        var RAIN_COUNT = 45;

        /* ---- Plantillas SVG de mini flores ---- */

        // Girasol completo (pétalos + centro)
        function svgSunflower(hue) {
          var petals = '';
          for (var p = 0; p < 8; p++) {
            petals += '<ellipse cx="20" cy="8" rx="5" ry="10" fill="hsl(' + hue + ',85%,65%)" transform="rotate(' + (p * 45) + ',20,20)" />';
          }
          return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">' +
            petals +
            '<circle cx="20" cy="20" r="7" fill="#6B4F10"/>' +
            '<circle cx="18" cy="18" r="2.5" fill="#8B6914" opacity="0.6"/>' +
            '</svg>';
        }

        // Margarita simple (pétalos redondos)
        function svgDaisy(hue) {
          var petals = '';
          for (var p = 0; p < 6; p++) {
            petals += '<ellipse cx="20" cy="9" rx="4.5" ry="8" fill="hsl(' + hue + ',80%,72%)" transform="rotate(' + (p * 60) + ',20,20)" />';
          }
          return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">' +
            petals +
            '<circle cx="20" cy="20" r="5.5" fill="hsl(' + hue + ',70%,55%)"/>' +
            '</svg>';
        }

        // Pétalo suelto
        function svgPetal(hue) {
          return '<svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="10" cy="15" rx="7" ry="13" fill="hsl(' + hue + ',82%,68%)" opacity="0.85"/>' +
            '<path d="M 10 3 Q 11 15 10 27" stroke="hsl(' + hue + ',60%,50%)" stroke-width="0.5" fill="none" opacity="0.4"/>' +
            '</svg>';
        }

        for (var j = 0; j < RAIN_COUNT; j++) {
          var el = document.createElement('div');
          el.classList.add('flower-rain');

          // Hue aleatorio en rango amarillo cálido (40-55)
          var hue = 40 + Math.random() * 18;

          // Tipo aleatorio: 40% girasol, 30% margarita, 30% pétalo
          var rand = Math.random();
          var svgHtml;
          if (rand < 0.4) {
            svgHtml = svgSunflower(hue);
          } else if (rand < 0.7) {
            svgHtml = svgDaisy(hue);
          } else {
            svgHtml = svgPetal(hue);
          }

          el.innerHTML = svgHtml;

          var size = 22 + Math.random() * 28;
          var left = Math.random() * 100;
          var duration = 2.5 + Math.random() * 3;
          var delay = Math.random() * 2;
          var spin = 180 + Math.random() * 360;

          el.style.cssText =
            'left:' + left + '%;' +
            'width:' + size + 'px;' +
            'height:' + size + 'px;' +
            '--fr-duration:' + duration + 's;' +
            '--fr-delay:' + delay + 's;' +
            '--fr-spin:' + spin + 'deg;';

          particlesContainer.appendChild(el);

          // Limpiar el elemento después de que termine la animación
          (function(element, d, dur) {
            setTimeout(function() {
              if (element.parentNode) element.parentNode.removeChild(element);
            }, (d + dur + 0.5) * 1000);
          })(el, delay, duration);
        }
      }
    })();
  </script>

</body>

</html>
